services:
  weaviate_node0:
    command:
    - --host
    - 0.0.0.0
    - --port
    - '8080'
    - --scheme
    - http
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      CLUSTER_DATA_BIND_PORT: '7101'
      CLUSTER_GOSSIP_BIND_PORT: '7100'
      CLUSTER_HOSTNAME: node0
      CLUSTER_JOIN: 192.168.200.204:7100
      ENABLE_MODULES: ''
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      PROMETHEUS_MONITORING_ENABLED: 'true'
      QUERY_DEFAULTS_LIMIT: 25
      RAFT_BOOTSTRAP_EXPECT: 1
      RAFT_JOIN: node0
    image: cr.weaviate.io/semitechnologies/weaviate:1.34.2
    network_mode: host
    restart: on-failure
    volumes:
    - weaviate_node0_data:/var/lib/weaviate
volumes:
  weaviate_node0_data:
    driver: local
    driver_opts:
      device: /home/CONNECT/xchen740/workspace/vector-retrieve/weaviate/volumes/weaviate_node0_data
      o: bind
      type: none
